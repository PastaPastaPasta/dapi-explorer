<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAPI console · dashhq</title>
    <script src="/dashhq/dashhq-shell.js"></script>
    <link rel="preload" href="/dashhq/fonts/archivo-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/dashhq/dashhq-tokens.css">
    <link rel="stylesheet" href="/dashhq/dashhq-shell.css">
    <link rel="stylesheet" href="/dashhq/dashhq-components.css">
    <link rel="icon" href="/dashhq/mark/favicon.svg" type="image/svg+xml">

    <script>
      // Polyfill process.nextTick for Node.js compatibility
      if (typeof globalThis.process === 'undefined') {
        globalThis.process = {
          env: {},
          nextTick: function(fn) {
            var args = Array.prototype.slice.call(arguments, 1);
            setTimeout(function() { fn.apply(null, args); }, 0);
          },
          version: '',
          versions: {},
          platform: 'browser',
          browser: true
        };
      } else if (typeof globalThis.process.nextTick !== 'function') {
        globalThis.process.nextTick = function(fn) {
          var args = Array.prototype.slice.call(arguments, 1);
          setTimeout(function() { fn.apply(null, args); }, 0);
        };
      }
    </script>
  </head>
  <body class="bg-gray-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
