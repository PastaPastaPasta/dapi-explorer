<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAPI Explorer</title>
    <script>
      // Polyfill process.nextTick for Node.js compatibility
      if (typeof globalThis.process === 'undefined') {
        globalThis.process = {
          env: {},
          nextTick: function(fn) {
            var args = Array.prototype.slice.call(arguments, 1);
            setTimeout(function() { fn.apply(null, args); }, 0);
          },
          version: '',
          versions: {},
          platform: 'browser',
          browser: true
        };
      } else if (typeof globalThis.process.nextTick !== 'function') {
        globalThis.process.nextTick = function(fn) {
          var args = Array.prototype.slice.call(arguments, 1);
          setTimeout(function() { fn.apply(null, args); }, 0);
        };
      }
    </script>
  </head>
  <body class="bg-gray-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
